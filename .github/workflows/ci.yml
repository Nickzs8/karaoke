name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-test:
    name: Lint & Testes Automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório (Checkout)
        uses: actions/checkout@v4

      - name: Configurar ambiente Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar FFmpeg (Dependência de Sistema para Áudio)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar dependências Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Executar Linter (Ruff Check)
        run: |
          ruff check .

      - name: Verificar Formatação de Código (Ruff Format)
        run: |
          ruff format --check .

      - name: Executar Testes Automatizados (Pytest)
        run: |
          pytest
