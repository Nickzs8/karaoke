[project]
name = "karaoke"
version = "0.1.0"
description = "Sistema inteligente de karaokê com IA e Clean Architecture"
readme = "README.md"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 88
exclude = [
    ".venv",
    "storage",
    "__pycache__",
    "build",
    "dist"
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["karaoke"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --import-mode=importlib"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
